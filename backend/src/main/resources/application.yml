# A Render injeta $PORT (10000); localmente segue 8080
server:
  # Render: obter o IP real do cliente em X-Forwarded-For (necessário para o
  # limite de tentativas de login/cadastro; issue #104). Localmente não há
  # proxy e o valor não muda nada.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  port: ${PORT:8080}

noiteboa:
  ratelimit:
    login:        # por IP + e-mail
      limite: ${RATELIMIT_LOGIN_LIMITE:5}
      janela-segundos: ${RATELIMIT_LOGIN_JANELA:60}
    cadastro:     # por IP
      limite: ${RATELIMIT_CADASTRO_LIMITE:5}
      janela-segundos: ${RATELIMIT_CADASTRO_JANELA:3600}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sono}
    username: ${POSTGRES_USER:sono}
    password: ${POSTGRES_PASSWORD:sono_dev_only}
    hikari:
      # Pool contido: Render free tem 512 MB e o Neon free limita conexões diretas
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
