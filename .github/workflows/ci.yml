name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e testes (backend)
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # jsdom 30 (dependência do Vitest) exige Node ^22.22.2 || ^24.15.0 || >=26
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Lint, testes e build (frontend)
        working-directory: frontend
        # `npm run build` já roda `tsc --noEmit` (typecheck) antes do Vite.
        run: |
          npm run lint
          TZ=UTC npm test
          TZ=America/Sao_Paulo npm test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # jsdom 30 (dependência do Vitest) exige Node ^22.22.2 || ^24.15.0 || >=26
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/e2e/package-lock.json
      - name: Compilar o front-end
        working-directory: frontend
        run: npm ci && npm run build
      - name: Instalar ferramentas de E2E
        working-directory: tools/e2e
        run: npm ci
      - name: Teste de fumaça (navegador)
        working-directory: tools/e2e
        # Usa o Chrome já presente no runner (fallback: Chromium do pacote)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke
