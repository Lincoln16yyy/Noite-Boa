# Permite pedir trabalho ao Claude comentando "@claude ..." em issues e PRs.
# Requisitos: GitHub App do Claude instalado no repo + segredo ANTHROPIC_API_KEY.
# Atenção: consome créditos da API e minutos do GitHub Actions.
# Só dispara para o dono do repositório (se o repo estiver em uma organização, ajuste a condição).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Fixada no SHA do commit para a tag não virar código mutável; o
      # Dependabot (github-actions) avisa quando sai versão nova.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
