server {
    # 8080: o container roda como usuario nao-root e portas < 1024 exigem root
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: qualquer rota desconhecida devolve o index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos do Vite levam hash no nome -> cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
